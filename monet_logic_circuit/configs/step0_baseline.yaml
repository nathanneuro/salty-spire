experiment: step0_baseline

model:
  name: monet
  checkpoint: MonetLLM/monet-vd-850M-100BT-hf  # Primary dev target; see docs/model_selection.md
  device: auto      # auto, cpu, cuda, cuda:0, etc.
  allowed_decompositions: [vd]  # HD variants deferred to late-stage comparison only

data:
  calibration:
    dataset: the_pile
    split: validation
    num_tokens: 4_000_000  # ~4M tokens for calibration traces
    seed: 42
  eval:
    dataset: the_pile
    split: test
    num_tokens: 1_000_000

eval:
  perplexity:
    enabled: true
    stride: 512
    max_length: 2048
  downstream:
    enabled: true
    tasks:
      - lambada_openai
      - hellaswag
      - arc_easy
      - arc_challenge
      - piqa
    num_fewshot: 0
    batch_size: auto

profiling:
  enabled: true
  num_batches: 50
  batch_size: 1
  sequence_length: 2048
  measure_components: true  # Per-component FLOP breakdown

expert_analysis:
  enabled: true
  granularity: half_expert       # Convert at the 2N=1024 half-expert level, not N^2 effective experts
  activation_frequency: true     # How often router selects each half-expert
  input_statistics: true         # Mean, variance, effective rank per half-expert
  output_statistics: true        # Mean, variance per half-expert output
  clustering: true               # Cluster half-experts by feature similarity
  num_clusters: auto             # Auto-select via elbow method

traces:
  save: true
  output_dir: outputs/step0/traces
  format: safetensors  # Per-half-expert (input, output) pairs on calibration set

outputs:
  dir: outputs/step0
  save_reference_table: true
  save_expert_characterization: true
